<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PaniPuri</title>
    <meta name="description" content="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --ink: #ece6dd;
            --muted: #8a8178;
            --line: #2c2925;
            --accent: #d98c3a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Karla", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        main {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -12vh;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: .9rem;
            margin-bottom: 2.75rem;
        }

        .logo svg {
            width: 52px;
            height: 52px;
        }

        .logo h1 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 700;
            font-size: clamp(2.6rem, 8vw, 3.4rem);
            letter-spacing: -.02em;
        }

        .logo h1 span {
            color: var(--accent);
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: .9rem;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 1.4rem;
            border-radius: 999px;
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
            font: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:hover {
            border-color: #45403a;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(217, 140, 58, .08);
        }

        button {
            position: absolute;
            left: -9999px;
        }

        ::selection {
            background: var(--accent);
            color: var(--bg);
        }
    </style>
</head>

<body>
    <main>
        <div class="logo">
            <svg viewBox="0 0 64 64" role="img" aria-label="Pani puri">
                <defs>
                    <radialGradient id="s" cx="35%" cy="28%" r="80%">
                        <stop offset="0%" stop-color="#f4bd6e" />
                        <stop offset="55%" stop-color="#c87e33" />
                        <stop offset="100%" stop-color="#7e441a" />
                    </radialGradient>
                    <radialGradient id="h" cx="50%" cy="40%" r="75%">
                        <stop offset="0%" stop-color="#1f1006" />
                        <stop offset="100%" stop-color="#4a2a13" />
                    </radialGradient>
                </defs>
                <ellipse cx="32" cy="34" rx="25" ry="24" fill="url(#s)" />
                <ellipse cx="23" cy="25" rx="6" ry="4" fill="rgba(255,236,200,0.28)" />
                <ellipse cx="32" cy="13.5" rx="9.5" ry="4.4" fill="url(#h)" />
                <ellipse cx="32" cy="13.5" rx="9.5" ry="4.4" fill="none" stroke="#f4bd6e" stroke-width="1.3"
                    opacity=".85" />
            </svg>
            <h1>Pani<span>Puri</span></h1>
        </div>
        <form method="get" action="">
            <input type="text" name="prayer" placeholder="Prayer" aria-label="Prayer" autocomplete="off">
            <input type="text" name="prompt" placeholder="Prompt" aria-label="Prompt" autocomplete="off">
            <button type="submit">Submit</button>
        </form>
    </main>
</body>

</html>
